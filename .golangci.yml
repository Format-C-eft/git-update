version: "2"
run:
  concurrency: 8
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - copyloopvar
    - errorlint
    - errcheck
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - nilerr
    - nilnil
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unused
    - wsl_v5
  settings:
    goconst:
      min-len: 2
      min-occurrences: 2
    govet:
      enable:
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: var-naming
          disabled: true
    wsl_v5:
      enable:
        - assign
        - branch
        - decl
        - defer
        - expr
        - for
        - go
        - if
        - inc-dec
        - label
        - range
        - return
        - select
        - switch
        - type-switch
        - append
        - assign-expr
        - err
        - leading-whitespace
        - trailing-whitespace
  exclusions:
    generated: lax
    paths:
      - bin
      - vendor
      - var
      - tmp
      - .cache
      - third_party$
      - builtin$
      - examples$
